[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fdp-sensitivity"
version = "0.1.0"
description = "Simultaneous FDP inference under Rosenbaum's sensitivity model"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "tqdm>=4.65",
    "gurobipy>=10.0",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.7",
    "jupyterlab>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gurobi: requires gurobipy and a working Gurobi license",
]
